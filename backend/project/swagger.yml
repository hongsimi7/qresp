swagger: "2.0"
info:
  description: This is the swagger file that provides the API to fetch data from Qresp server
  version: "1.0"
  title: Swagger REST Article
consumes:
  - "application/json"
produces:
  - "application/json"

basePath: "/api"

# Paths supported by the server application
paths:
  /search:
    get:
      operationId: "project.api.search"
      tags:
        - "Papers"
      summary: "Fetches all papers"
      description: "Read the list of papers"
      parameters:
        - in: query
          name: searchWord
          type: string
          required: false
          description: Filter paper results based on search word
        - in: query
          name: paperTitle
          type: string
          required: false
          description: Filter paper results based on paper title
        - in: query
          name: doi
          type: string
          required: false
          description: Filter paper results based on paper doi
        - in: query
          name: tags
          type: string
          required: false
          description: Filter paper results based on paper tags
        - in: query
          name: collectionList
          type: string
          required: false
          description: Filter paper results based on collection. Seperate by comma for multiple values
        - in: query
          name: authorsList
          type: string
          required: false
          description: Filter paper results based on authors. Seperate by comma for multiple values
        - in: query
          name: publicationList
          required: false
          type: string
          description: Filter paper results based on publication. Seperate by comma for multiple values
      responses:
        200:
          description: "Successful read papers list operation"
          schema:
            type: "array"
            items:
              properties:
                _Search__abstract:
                  type: "string"
                _Search__authors:
                  type: "string"
                _Search__collections:
                  type: "array"
                _Search__doi:
                  type: "string"
                _Search__downloadPath:
                  type: "string"
                _Search__fileServerPath:
                  type: "string"
                _Search__folderAbsolutePath:
                  type: "string"
                _Search__id":
                  type: "string"
                _Search__notebookFile:
                  type: "string"
                _Search__notebookPath:
                  type: "string"
                _Search__publication:
                  type: "string"
                _Search__serverPath:
                  type: "string"
                _Search__tags:
                  type: "array"
                _Search__title:
                  type: "string"
                _Search__year:
                  type: "integer"
  /collections:
    get:
      operationId: "project.api.collections"
      tags:
        - "Collections"
      summary: "Fetches all collections"
      description: "Fetches collections from all Papers"
      responses:
        200:
          description: "Successful read collections list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /authors:
    get:
      operationId: "project.api.authors"
      tags:
        - "Authors"
      summary: "Fetches all authors"
      description: "Fetches authors from papers"
      responses:
        200:
          description: "Successful read authors list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /publications:
    get:
      operationId: "project.api.publications"
      tags:
        - "Publications"
      summary: "Fetches all publications"
      description: "Fetches publications from all papers"
      responses:
        200:
          description: "Successful read paper publications operation"
          schema:
            type: "array"
            items:
              type: "string"
  /paper/{id}:
    get:
      operationId: "project.api.paper"
      tags:
        - "Paper details"
      summary: "Fetches details of paper given id"
      description: "Fetches paper details given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read paper details "
    put:
      operationId: "project.api.update_paper"
      tags:
        - "Paper details"
      summary: "Updates a record's metadata (record owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: paper
          description: Partial or full paper metadata; top-level fields are
            merged into the stored record. Server-owned fields (id,
            owner_email, version bookkeeping) are ignored if present.
          required: true
          schema:
            type: object
      responses:
        200:
          description: Record updated
        400:
          description: Payload failed model validation
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin can edit
        404:
          description: Paper with this id does not exist
  /workflow/{id}:
    get:
      operationId: "project.api.workflow"
      tags:
        - "Workflow details"
      summary: "Fetches workflow of paper given id"
      description: "Fetches workflow of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /paper/{id}/chart/{cid}:
    get:
      operationId: "project.api.chart"
      tags:
        - "Chart details"
      summary: "Fetches chart of paper given id of paper and chart"
      description: "Fetches chart of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: path
          name: cid
          type: string
          required: true
          description: Chart Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /dircont:
    post:
      operationId: "project.api.dircontents"
      tags:
        - "Data source contents"
      summary: Returns a list of files and folders inside the directory
      parameters:
        - in: body
          name: req
          description: Contents to get of link.
          schema:
            type: object
            required:
              - link
              - src
              - service
            properties:
              link:
                type: string
              src:
                type: string
              service:
                type: boolean
      responses:
        200:
          description: Contents returned
        500:
          description: Failure
  /preview/{id}:
    get:
      operationId: "project.api.getPreview"
      tags:
        - "Get metadata for the preview"
      summary: "Get the metadata for preview from the id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Metadata paper ID
      responses:
        200:
          description: Metadata successfully returned
        400:
          description: Incorrect paper id, paper with this id does not exist in the database
        500:
          description: Internal server error
  /preview:
    post:
      operationId: "project.api.generatePreview"
      tags:
        - "Generate metadata link"
      summary: "Add data for previewing the metadata under curation"
      parameters:
        - in: body
          name: paper
          description: The metadata for which the preview is to be generated
          schema:
            type: object
      responses:
        200:
          description: Metadata successfully added and returned
        400:
          description: Incorrect paper object
        500:
          description: Internal server error
  /publish:
    post:
      operationId: "project.api.publish"
      tags:
        - "Generate Publish Link"
      summary: "Send an email to the curator with the link to publish the paper (authenticated users only; the session identity becomes the record owner)"
      parameters:
        - in: body
          name: paper
          description: The paper to be published
          schema:
            type: object
      responses:
        200:
          description: Successfully generated the verify link
        400:
          description: Incorrect paper object
        401:
          description: Authentication is required to publish
        500:
          description: Internal server error
  /paper/{id}/active:
    put:
      operationId: "project.api.set_paper_active"
      tags:
        - "Paper details"
      summary: "Activate or deactivate (soft delete) a record (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Set active=false to hide the record from public
            discovery, active=true to restore it.
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
      responses:
        200:
          description: Record activation state updated
        400:
          description: active must be a boolean
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may change this
        404:
          description: Paper with this id does not exist
  /paper/{id}/editors:
    put:
      operationId: "project.api.set_paper_editors"
      tags:
        - "Paper details"
      summary: "Replaces the record's editor list (owner or admin only; editors are edit-only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Full replacement editor list; emails are normalized
            lowercase and deduplicated.
          schema:
            type: object
            required:
              - editor_emails
            properties:
              editor_emails:
                type: array
                items:
                  type: string
      responses:
        200:
          description: Editor list updated
        400:
          description: editor_emails missing or contains an invalid email
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may manage editors
        404:
          description: Paper with this id does not exist
  /paper/{id}/raw:
    get:
      operationId: "project.api.raw_paper"
      tags:
        - "Paper details"
      summary: "Returns the stored record document for editing (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Stored record document returned
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may load this
        404:
          description: Paper with this id does not exist
  /account/papers:
    get:
      operationId: "project.api.account_papers"
      tags:
        - "Account"
      summary: "Lists records owned by the current session user"
      responses:
        200:
          description: Compact list of the user's records
        401:
          description: Authentication required
  /account/drafts:
    get:
      operationId: "project.api.account_drafts"
      tags:
        - "Account"
      summary: "Lists the current session user's curator drafts"
      responses:
        200:
          description: Compact list of the user's drafts (no state payloads)
        401:
          description: Authentication required
    post:
      operationId: "project.api.create_account_draft"
      tags:
        - "Account"
      summary: "Saves a new curator draft (state may be arbitrarily incomplete)"
      parameters:
        - in: body
          name: body
          required: true
          description: Draft payload; state is stored as-is, never
            publish-validated.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft created; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
  /account/drafts/{id}:
    get:
      operationId: "project.api.account_draft"
      tags:
        - "Account"
      summary: "Returns one of the user's drafts including its full state"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft returned
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    put:
      operationId: "project.api.update_account_draft"
      tags:
        - "Account"
      summary: "Updates one of the user's drafts (title and/or state)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
        - in: body
          name: body
          required: true
          description: Fields to update; state is stored as-is.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft updated; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    delete:
      operationId: "project.api.delete_account_draft"
      tags:
        - "Account"
      summary: "Deletes one of the user's drafts"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft deleted
        401:
          description: Authentication required
        404:
          description: No such draft for this user
  /admin/papers:
    get:
      operationId: "project.api.admin_papers"
      tags:
        - "Admin"
      summary: "Lists ALL records — active, deactivated, ownerless — for admin management"
      responses:
        200:
          description: Compact list of every stored record
        401:
          description: Authentication required
        403:
          description: Only an admin may list all records
  /admin/ownerless-papers:
    get:
      operationId: "project.api.ownerless_papers"
      tags:
        - "Admin"
      summary: "Lists legacy records without a verified owner (admin only)"
      responses:
        200:
          description: Compact list of ownerless records
        401:
          description: Authentication required
        403:
          description: Only an admin may list ownerless records
  /paper/{id}/owner:
    put:
      operationId: "project.api.assign_paper_owner"
      tags:
        - "Admin"
      summary: "Assigns a verified owner to a record (admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: The owner to assign; set force=true to replace an
            existing owner.
          schema:
            type: object
            required:
              - owner_email
            properties:
              owner_email:
                type: string
              force:
                type: boolean
      responses:
        200:
          description: Owner assigned
        400:
          description: Invalid email address
        401:
          description: Authentication required
        403:
          description: Only an admin may assign owners
        404:
          description: Paper with this id does not exist
        409:
          description: Record already has a different owner (use force)
  /federation/servers:
    get:
      operationId: "project.federation.federation_servers"
      tags:
        - "Paper details"
      summary: "The Qresp servers this deployment federates with"
      description: "The single authoritative federation list: the same set
        `?server=` is checked against, published so the Explorer offers
        exactly the servers the backend will accept. Derived and read-only;
        every origin is still re-checked (HTTPS, literal address, DNS) before
        any request is made to it."
      responses:
        200:
          description: "`{servers: [{qresp_server_url, isActive,
            qresp_maintainer_emails}]}`, in the shape the federated registry
            has always used"
  /paper/{id}/related:
    get:
      operationId: "project.related.related_research"
      tags:
        - "Paper details"
      summary: "Related Qresp records and related external papers for a
        record (read-only; public active records only)"
      description: "Computes Related Qresp Records from the published
        scientific metadata of active records, and judges Semantic Scholar
        recommendations with the same Qresp quality gate. Off unless
        QRESP_RELATED_RESEARCH_ENABLED is set, in which case both lists come
        back empty with status `disabled`. External results are cached
        separately from the Paper document and never written into it; a
        provider timeout, 404, 429 or malformed answer degrades the external
        section only. Nothing here modifies a record."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: query
          name: server
          type: string
          required: false
          description: >-
            The Qresp server that holds the record, as on the detail page URL
            (e.g. https://paperstack.example.org). Omitted, or naming this
            server, the record and the corpus are read locally exactly as
            before. Naming a server in the federated registry, both are read
            from that server over HTTPS and scored against ITS corpus; the
            record is never copied into this server's database. Any other
            value is refused with 400 — no arbitrary URL is fetched, and there
            is no fallback to the local database.
      responses:
        200:
          description: >-
            Two independent lists, each capped at three and never padded.
            `internal[].id` links to the Qresp detail page and
            `internal[].server` names the Qresp server it lives on (empty for
            this one); `external[].url` prefers an HTTPS DOI link.
            `source_server` echoes the server both lists were computed from.
            Every result carries grounded `reasons` (at most three). Each
            section reports a `status`: `ok`, `disabled`, `unavailable`, and
            for the external one also `unresolved` and `stale`, which is true
            when a refresh failed and the last successful results are being
            served.
        400:
          description: The requested Qresp server is not one this server federates with
        404:
          description: No such record, or the record is not publicly available
  /paper/{id}/permissions:
    get:
      operationId: "project.api.paper_permissions"
      tags:
        - "Paper permissions"
      summary: "Reports whether the current session may edit the record"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Permission decision returned
        404:
          description: Paper with this id does not exist
  /auth/google:
    get:
      operationId: "project.auth.google_login"
      tags:
        - "Authentication"
      summary: "Starts the Google OAuth identity flow (openid/email/profile only)"
      parameters:
        - in: query
          name: next
          type: string
          required: false
          description: Same-origin path to return to after sign-in
      responses:
        302:
          description: Redirect to Google's consent screen
        503:
          description: Google login is not configured on this server
  /auth/google/callback:
    get:
      operationId: "project.auth.google_callback"
      tags:
        - "Authentication"
      summary: "Completes Google sign-in and stores the session user"
      parameters:
        - in: query
          name: state
          type: string
          required: false
        - in: query
          name: code
          type: string
          required: false
        - in: query
          name: error
          type: string
          required: false
      responses:
        302:
          description: Signed in; redirect back to the app
        400:
          description: Invalid state, missing code, or Google error
        503:
          description: Google login is not configured on this server
  /import/doi:
    post:
      operationId: "project.manuscript.lookup_doi"
      tags:
        - "Import"
      summary: "Proposes bibliographic metadata for a DOI (authenticated; proposals only)"
      parameters:
        - in: body
          name: body
          required: true
          description: "The DOI to look up (URL and doi: prefixes accepted)."
          schema:
            type: object
            required:
              - doi
            properties:
              doi:
                type: string
      responses:
        200:
          description: Proposed metadata returned (fields may be partial)
        400:
          description: Not a valid DOI
        401:
          description: Authentication required
        404:
          description: DOI not found in the registry
        502:
          description: DOI registry unreachable or erroring
  /assist/keywords:
    post:
      operationId: "project.assist.suggest_keywords"
      tags:
        - "Assist"
      summary: "Suggests Keywords from the record's OWN metadata (opt-in;
        suggestions only, never applied)"
      parameters:
        - in: body
          name: body
          required: true
          description: Explicit consent plus an allowlist of the curator's own
            metadata - the paper's bibliographic fields, and the descriptive
            fields of datasets/charts/scripts/tools already accepted into the
            record. No file content, no manuscript, no paths or URLs, no
            unclassified files, no unaccepted folder candidates, and no
            curator, owner, editor or account data is accepted here.
          schema:
            type: object
            required:
              - consent
            properties:
              consent:
                type: boolean
              kind: {type: string}
              title: {type: string}
              abstract: {type: string}
              publication: {type: string}
              doi: {type: string}
              year: {type: string}
              basenames:
                type: array
                description: File names only, never paths. Bounded server-side.
                items: {type: string}
              charts:
                type: array
                items:
                  type: object
                  properties:
                    caption: {type: string}
                    properties:
                      type: array
                      items: {type: string}
              datasets:
                type: array
                items:
                  type: object
                  properties:
                    description: {type: string}
                    keywords: {type: string}
              scripts:
                type: array
                items:
                  type: object
                  properties:
                    description: {type: string}
                    keywords: {type: string}
              tools:
                type: array
                items:
                  type: object
                  properties:
                    packageName: {type: string}
                    description: {type: string}
                    facility: {type: string}
                    measurement: {type: string}
      responses:
        200:
          description: Up to 8 keyword suggestions, each flagged as an
            existing Qresp keyword or a new one
        400:
          description: Consent missing, or nothing to work from
        401:
          description: Authentication required
        403:
          description: CSRF token missing or invalid
        429:
          description: Daily per-user AI suggestion limit reached
        502:
          description: AI provider failed or answered unreadably
        503:
          description: AI keyword suggestions are not configured on this server
  /curation/analyze-folder:
    post:
      operationId: "project.curation.analyze_folder"
      tags:
        - "Import"
      summary: "Inventories and classifies a file-server folder into reviewable
        curation candidates (read-only; nothing is saved or published)"
      parameters:
        - in: body
          name: body
          required: true
          description: The already-saved file server folder to inspect. It must
            resolve inside a file-server root configured on this server; no
            other host, scheme, or parent path is fetchable.
          schema:
            type: object
            required:
              - path
            properties:
              path:
                type: string
              boundaries:
                type: object
                description: Optional record-boundary selection, keyed by the
                  role directory it applies to. Each value is a list of
                  relative folder paths that this analysis listed; a selected
                  folder becomes exactly one candidate containing everything
                  beneath it, replacing the default immediate children for
                  that root only. Validated server-side.
              chart_plan:
                type: array
                description: Optional per-IMAGE chart plan. A Chart record
                  holds exactly one image, so its unit of choice is the image
                  file, not a folder. Each entry gives one discovered image
                  (see chart_image_groups in the response) a single role
                  and applies only to the folder that image sits in; a folder
                  no entry mentions keeps its default proposal. Omit the
                  field entirely, or send an empty list, for the default
                  behaviour. Validated server-side before any candidate is
                  built.
                items:
                  # Deliberately not `required`/`enum` here. Every rejection
                  # a curator can act on comes from validate_chart_plan, in
                  # one place and in one voice, exactly as `boundaries` does
                  # -- a raw JSON-schema violation is not a sentence anyone
                  # can fix a folder from.
                  type: object
                  properties:
                    path:
                      type: string
                      description: Relative POSIX path of an image this
                        analysis discovered. URLs, absolute paths, `..`,
                        backslashes and percent-encoding are refused, as is
                        any path not listed in chart_image_groups.
                    action:
                      type: string
                      description: >-
                        One of `chart`, `supporting` or `ignore`.
                        `chart` makes this image one Chart candidate of its
                        own; `supporting` appends it to the target Chart's
                        `files`; `ignore` creates nothing from it.
                    target:
                      type: string
                      description: Required for `supporting`, and forbidden
                        otherwise. Must be an image in the SAME chart folder
                        whose own action is `chart`.
      responses:
        200:
          description: >-
            Deterministic candidates for curator review. Structure metadata
            sits at the TOP level of the envelope — structure_mode,
            structure_issues, normalized_roles (actual directory name ->
            canonical role), boundary_trees, applied_boundaries,
            chart_image_groups and applied_chart_plan — while the per-kind
            candidate lists sit under `candidates`.
            boundary_trees and applied_boundaries are always present; in
            legacy mode every datasets/scripts role root appears, with an
            empty `nodes` list when it has no selectable child folders.
            chart_image_groups is always present too: one entry per folder
            that holds chart images, as
            {folder, role_root, images: [{path, reason, suggested_action}],
            notebooks: [{path}]}, where suggested_action is advisory and is
            "chart" only for the single image the deterministic rule would
            have picked, "review" otherwise. applied_chart_plan echoes the
            validated plan actually in force, sorted by path.
        400:
          description: Missing, malformed, or out-of-root folder path, or a
            rejected boundary selection or chart plan
        401:
          description: Authentication required
        403:
          description: CSRF token missing or invalid
        404:
          description: The folder is empty
        502:
          description: The file server could not be read
  /curation/describe-candidates:
    post:
      operationId: "project.curation.describe_candidates"
      tags:
        - "Import"
      summary: "Suggests a description and keywords for ONE folder candidate
        via the configured AI provider (opt-in; suggestions only)"
      parameters:
        - in: body
          name: body
          required: true
          description: Explicit consent plus the allowlisted, bounded
            description of EXACTLY ONE candidate (id, kind, name, relative
            paths, file-kind inventory, and the structured evidence sources
            the analysis extracted from inside that candidate's own
            boundary). Batching produced partial and noticeably worse
            answers, so zero or more than one item is rejected with 400
            before the provider or the quota is touched. No raw dataset
            values, image bytes, notebook code cells or outputs, function
            bodies, credentials, or user data are accepted here. The former
            free-text `context` key is IGNORED, because the browser used to
            fill it with the curator's own draft readme/description, which
            fed the answer back as its own input.
          schema:
            type: object
            required:
              - consent
              - items
            properties:
              consent:
                type: boolean
              paper_context:
                type: object
                description: The paper's own title and abstract, sent as
                  BACKGROUND for the research topic. The system prompt
                  forbids using it as evidence for what an individual
                  artifact does; both fields are clipped and redacted.
                properties:
                  title:
                    type: string
                  abstract:
                    type: string
              items:
                type: array
                minItems: 1
                maxItems: 1
                description: Exactly one candidate.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    paths:
                      type: array
                      items:
                        type: string
                    inventory:
                      type: object
                      description: File kinds and counts for this candidate
                        only — never the file list.
                      properties:
                        file_count:
                          type: integer
                        extensions:
                          type: array
                          items:
                            type: object
                            properties:
                              extension:
                                type: string
                              count:
                                type: integer
                        sample_names:
                          type: array
                          items:
                            type: string
                    sources:
                      type: array
                      description: The candidate's `ai_sources`, echoed back
                        from analyze-folder. Every entry is re-validated,
                        re-redacted and re-bounded on the server, so a client
                        cannot widen what travels.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - readme
                              - docstring
                              - python_symbols
                              - comment_header
                              - notebook_markdown
                              - manifest
                              - declarations
                          path:
                            type: string
                          excerpt:
                            type: string
                          names:
                            type: array
                            items:
                              type: string
      responses:
        200:
          description: Suggestions returned for the curator to review
        400:
          description: Consent missing, or not exactly one candidate
        401:
          description: Authentication required
        403:
          description: CSRF token missing or invalid
        429:
          description: Daily per-user AI suggestion limit reached
        502:
          description: AI provider failed or answered unreadably
        503:
          description: AI descriptions are not configured on this server
  /auth/microsoft:
    get:
      operationId: "project.auth.microsoft_login"
      tags:
        - "Authentication"
      summary: "Starts Microsoft Entra (work/school) OIDC sign-in (identity-only scopes, PKCE)"
      parameters:
        - in: query
          name: next
          type: string
          required: false
          description: Same-origin path to return to after sign-in
      responses:
        302:
          description: Redirect to the Microsoft account-selection screen
        503:
          description: Microsoft sign-in is not configured on this server
  /auth/microsoft/callback:
    get:
      operationId: "project.auth.microsoft_callback"
      tags:
        - "Authentication"
      summary: "Completes Microsoft Entra sign-in and stores the session user"
      parameters:
        - in: query
          name: state
          type: string
          required: false
        - in: query
          name: code
          type: string
          required: false
        - in: query
          name: error
          type: string
          required: false
      responses:
        302:
          description: Signed in; redirect back to the app
        400:
          description: Invalid state/nonce, missing code, or rejected identity token
        503:
          description: Microsoft sign-in is not configured on this server
  /auth/me:
    get:
      operationId: "project.auth.me"
      tags:
        - "Authentication"
      summary: "Returns the current session's authentication state"
      responses:
        200:
          description: Authentication state returned
  /auth/logout:
    post:
      operationId: "project.auth.logout"
      tags:
        - "Authentication"
      summary: "Clears the authenticated user from the session"
      responses:
        200:
          description: Logged out
  /auth/dev-login:
    post:
      operationId: "project.auth.dev_login"
      tags:
        - "Authentication"
      summary: "Development-only session login (off unless QRESP_ENABLE_DEV_LOGIN is set)"
      parameters:
        - in: body
          name: credentials
          description: Development user identity
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
              name:
                type: string
              is_admin:
                type: boolean
      responses:
        200:
          description: Logged in
        400:
          description: Invalid credentials payload
        404:
          description: Dev login is disabled
  /verify/{id}:
    get:
      operationId: "project.api.verify"
      tags:
        - "Verify the user and publish"
      summary: "Publish the paper on the instance after successful verification"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Temporary ppublish id provided by the server
      responses:
        200:
          description: Paper successfully published
        400:
          description: Incorrect tmp publish paper id, no paper waiting to be published with this id
        500:
          description: Internal server error
