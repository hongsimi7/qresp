swagger: "2.0"
info:
  description: This is the swagger file that provides the API to fetch data from Qresp server
  version: "1.0"
  title: Swagger REST Article
consumes:
  - "application/json"
produces:
  - "application/json"

basePath: "/api"

# Paths supported by the server application
paths:
  /search:
    get:
      operationId: "project.api.search"
      tags:
        - "Papers"
      summary: "Fetches all papers"
      description: "Read the list of papers"
      parameters:
        - in: query
          name: searchWord
          type: string
          required: false
          description: Filter paper results based on search word
        - in: query
          name: paperTitle
          type: string
          required: false
          description: Filter paper results based on paper title
        - in: query
          name: doi
          type: string
          required: false
          description: Filter paper results based on paper doi
        - in: query
          name: tags
          type: string
          required: false
          description: Filter paper results based on paper tags
        - in: query
          name: collectionList
          type: string
          required: false
          description: Filter paper results based on collection. Seperate by comma for multiple values
        - in: query
          name: authorsList
          type: string
          required: false
          description: Filter paper results based on authors. Seperate by comma for multiple values
        - in: query
          name: publicationList
          required: false
          type: string
          description: Filter paper results based on publication. Seperate by comma for multiple values
      responses:
        200:
          description: "Successful read papers list operation"
          schema:
            type: "array"
            items:
              properties:
                _Search__abstract:
                  type: "string"
                _Search__authors:
                  type: "string"
                _Search__collections:
                  type: "array"
                _Search__doi:
                  type: "string"
                _Search__downloadPath:
                  type: "string"
                _Search__fileServerPath:
                  type: "string"
                _Search__folderAbsolutePath:
                  type: "string"
                _Search__id":
                  type: "string"
                _Search__notebookFile:
                  type: "string"
                _Search__notebookPath:
                  type: "string"
                _Search__publication:
                  type: "string"
                _Search__serverPath:
                  type: "string"
                _Search__tags:
                  type: "array"
                _Search__title:
                  type: "string"
                _Search__year:
                  type: "integer"
  /collections:
    get:
      operationId: "project.api.collections"
      tags:
        - "Collections"
      summary: "Fetches all collections"
      description: "Fetches collections from all Papers"
      responses:
        200:
          description: "Successful read collections list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /authors:
    get:
      operationId: "project.api.authors"
      tags:
        - "Authors"
      summary: "Fetches all authors"
      description: "Fetches authors from papers"
      responses:
        200:
          description: "Successful read authors list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /publications:
    get:
      operationId: "project.api.publications"
      tags:
        - "Publications"
      summary: "Fetches all publications"
      description: "Fetches publications from all papers"
      responses:
        200:
          description: "Successful read paper publications operation"
          schema:
            type: "array"
            items:
              type: "string"
  /paper/{id}:
    get:
      operationId: "project.api.paper"
      tags:
        - "Paper details"
      summary: "Fetches details of paper given id"
      description: "Fetches paper details given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read paper details "
    put:
      operationId: "project.api.update_paper"
      tags:
        - "Paper details"
      summary: "Updates a record's metadata (record owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: paper
          description: Partial or full paper metadata; top-level fields are
            merged into the stored record. Server-owned fields (id,
            owner_email, version bookkeeping) are ignored if present.
          required: true
          schema:
            type: object
      responses:
        200:
          description: Record updated
        400:
          description: Payload failed model validation
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin can edit
        404:
          description: Paper with this id does not exist
  /workflow/{id}:
    get:
      operationId: "project.api.workflow"
      tags:
        - "Workflow details"
      summary: "Fetches workflow of paper given id"
      description: "Fetches workflow of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /paper/{id}/chart/{cid}:
    get:
      operationId: "project.api.chart"
      tags:
        - "Chart details"
      summary: "Fetches chart of paper given id of paper and chart"
      description: "Fetches chart of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: path
          name: cid
          type: string
          required: true
          description: Chart Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /dircont:
    post:
      operationId: "project.api.dircontents"
      tags:
        - "Data source contents"
      summary: Returns a list of files and folders inside the directory
      parameters:
        - in: body
          name: req
          description: Contents to get of link.
          schema:
            type: object
            required:
              - link
              - src
              - service
            properties:
              link:
                type: string
              src:
                type: string
              service:
                type: boolean
      responses:
        200:
          description: Contents returned
        500:
          description: Failure
  /preview/{id}:
    get:
      operationId: "project.api.getPreview"
      tags:
        - "Get metadata for the preview"
      summary: "Get the metadata for preview from the id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Metadata paper ID
      responses:
        200:
          description: Metadata successfully returned
        400:
          description: Incorrect paper id, paper with this id does not exist in the database
        500:
          description: Internal server error
  /preview:
    post:
      operationId: "project.api.generatePreview"
      tags:
        - "Generate metadata link"
      summary: "Add data for previewing the metadata under curation"
      parameters:
        - in: body
          name: paper
          description: The metadata for which the preview is to be generated
          schema:
            type: object
      responses:
        200:
          description: Metadata successfully added and returned
        400:
          description: Incorrect paper object
        500:
          description: Internal server error
  /publish:
    post:
      operationId: "project.api.publish"
      tags:
        - "Generate Publish Link"
      summary: "Send an email to the curator with the link to publish the paper (authenticated users only; the session identity becomes the record owner)"
      parameters:
        - in: body
          name: paper
          description: The paper to be published
          schema:
            type: object
      responses:
        200:
          description: Successfully generated the verify link
        400:
          description: Incorrect paper object
        401:
          description: Authentication is required to publish
        500:
          description: Internal server error
  /paper/{id}/active:
    put:
      operationId: "project.api.set_paper_active"
      tags:
        - "Paper details"
      summary: "Activate or deactivate (soft delete) a record (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Set active=false to hide the record from public
            discovery, active=true to restore it.
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
      responses:
        200:
          description: Record activation state updated
        400:
          description: active must be a boolean
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may change this
        404:
          description: Paper with this id does not exist
  /paper/{id}/editors:
    put:
      operationId: "project.api.set_paper_editors"
      tags:
        - "Paper details"
      summary: "Replaces the record's editor list (owner or admin only; editors are edit-only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Full replacement editor list; emails are normalized
            lowercase and deduplicated.
          schema:
            type: object
            required:
              - editor_emails
            properties:
              editor_emails:
                type: array
                items:
                  type: string
      responses:
        200:
          description: Editor list updated
        400:
          description: editor_emails missing or contains an invalid email
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may manage editors
        404:
          description: Paper with this id does not exist
  /paper/{id}/raw:
    get:
      operationId: "project.api.raw_paper"
      tags:
        - "Paper details"
      summary: "Returns the stored record document for editing (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Stored record document returned
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may load this
        404:
          description: Paper with this id does not exist
  /account/papers:
    get:
      operationId: "project.api.account_papers"
      tags:
        - "Account"
      summary: "Lists records owned by the current session user"
      responses:
        200:
          description: Compact list of the user's records
        401:
          description: Authentication required
  /account/drafts:
    get:
      operationId: "project.api.account_drafts"
      tags:
        - "Account"
      summary: "Lists the current session user's curator drafts"
      responses:
        200:
          description: Compact list of the user's drafts (no state payloads)
        401:
          description: Authentication required
    post:
      operationId: "project.api.create_account_draft"
      tags:
        - "Account"
      summary: "Saves a new curator draft (state may be arbitrarily incomplete)"
      parameters:
        - in: body
          name: body
          required: true
          description: Draft payload; state is stored as-is, never
            publish-validated.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft created; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
  /account/drafts/{id}:
    get:
      operationId: "project.api.account_draft"
      tags:
        - "Account"
      summary: "Returns one of the user's drafts including its full state"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft returned
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    put:
      operationId: "project.api.update_account_draft"
      tags:
        - "Account"
      summary: "Updates one of the user's drafts (title and/or state)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
        - in: body
          name: body
          required: true
          description: Fields to update; state is stored as-is.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft updated; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    delete:
      operationId: "project.api.delete_account_draft"
      tags:
        - "Account"
      summary: "Deletes one of the user's drafts"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft deleted
        401:
          description: Authentication required
        404:
          description: No such draft for this user
  /admin/papers:
    get:
      operationId: "project.api.admin_papers"
      tags:
        - "Admin"
      summary: "Lists ALL records — active, deactivated, ownerless — for admin management"
      responses:
        200:
          description: Compact list of every stored record
        401:
          description: Authentication required
        403:
          description: Only an admin may list all records
  /admin/ownerless-papers:
    get:
      operationId: "project.api.ownerless_papers"
      tags:
        - "Admin"
      summary: "Lists legacy records without a verified owner (admin only)"
      responses:
        200:
          description: Compact list of ownerless records
        401:
          description: Authentication required
        403:
          description: Only an admin may list ownerless records
  /paper/{id}/owner:
    put:
      operationId: "project.api.assign_paper_owner"
      tags:
        - "Admin"
      summary: "Assigns a verified owner to a record (admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: The owner to assign; set force=true to replace an
            existing owner.
          schema:
            type: object
            required:
              - owner_email
            properties:
              owner_email:
                type: string
              force:
                type: boolean
      responses:
        200:
          description: Owner assigned
        400:
          description: Invalid email address
        401:
          description: Authentication required
        403:
          description: Only an admin may assign owners
        404:
          description: Paper with this id does not exist
        409:
          description: Record already has a different owner (use force)
  /paper/{id}/permissions:
    get:
      operationId: "project.api.paper_permissions"
      tags:
        - "Paper permissions"
      summary: "Reports whether the current session may edit the record"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Permission decision returned
        404:
          description: Paper with this id does not exist
  /auth/google:
    get:
      operationId: "project.auth.google_login"
      tags:
        - "Authentication"
      summary: "Starts the Google OAuth identity flow (openid/email/profile only)"
      parameters:
        - in: query
          name: next
          type: string
          required: false
          description: Same-origin path to return to after sign-in
      responses:
        302:
          description: Redirect to Google's consent screen
        503:
          description: Google login is not configured on this server
  /auth/google/callback:
    get:
      operationId: "project.auth.google_callback"
      tags:
        - "Authentication"
      summary: "Completes Google sign-in and stores the session user"
      parameters:
        - in: query
          name: state
          type: string
          required: false
        - in: query
          name: code
          type: string
          required: false
        - in: query
          name: error
          type: string
          required: false
      responses:
        302:
          description: Signed in; redirect back to the app
        400:
          description: Invalid state, missing code, or Google error
        503:
          description: Google login is not configured on this server
  /import/doi:
    post:
      operationId: "project.manuscript.lookup_doi"
      tags:
        - "Import"
      summary: "Proposes bibliographic metadata for a DOI (authenticated; proposals only)"
      parameters:
        - in: body
          name: body
          required: true
          description: "The DOI to look up (URL and doi: prefixes accepted)."
          schema:
            type: object
            required:
              - doi
            properties:
              doi:
                type: string
      responses:
        200:
          description: Proposed metadata returned (fields may be partial)
        400:
          description: Not a valid DOI
        401:
          description: Authentication required
        404:
          description: DOI not found in the registry
        502:
          description: DOI registry unreachable or erroring
  /import/manuscript:
    post:
      operationId: "project.manuscript.import_manuscript"
      tags:
        - "Import"
      summary: "Proposes draft metadata from a .tex file or Overleaf .zip (in-memory, never stored or executed)"
      parameters:
        - in: body
          name: body
          required: true
          description: The manuscript source file, base64-encoded client-side.
          schema:
            type: object
            required:
              - filename
              - content_base64
            properties:
              filename:
                type: string
              content_base64:
                type: string
      responses:
        200:
          description: Proposed metadata with provenance and warnings
        400:
          description: Unsupported, oversized, unsafe, or unparseable upload
        401:
          description: Authentication required
  /assist/keywords:
    post:
      operationId: "project.assist.suggest_keywords"
      tags:
        - "Import"
      summary: "Suggests up to 8 keywords via the configured AI provider (opt-in; suggestions only, never auto-applied)"
      parameters:
        - in: body
          name: body
          required: true
          description: Allowlisted metadata (title/abstract/venue/doi) and,
            with explicit user consent, a manuscript source file to analyze
            in memory.
          schema:
            type: object
            properties:
              title:
                type: string
              abstract:
                type: string
              venue:
                type: string
              doi:
                type: string
              filename:
                type: string
              content_base64:
                type: string
      responses:
        200:
          description: Keyword suggestions returned (max 8, deduplicated)
        400:
          description: Nothing analyzable, oversized, or unsafe upload
        401:
          description: Authentication required
        429:
          description: Daily per-user AI suggestion limit reached
        502:
          description: AI provider failed or answered unreadably
        503:
          description: AI suggestions are not configured on this server
  /auth/cilogon:
    get:
      operationId: "project.auth.cilogon_login"
      tags:
        - "Authentication"
      summary: "Starts the institutional (CILogon) OIDC sign-in flow (identity-only scopes, PKCE)"
      parameters:
        - in: query
          name: next
          type: string
          required: false
          description: Same-origin path to return to after sign-in
      responses:
        302:
          description: Redirect to the CILogon institution-selection screen
        503:
          description: Institutional login is not configured on this server
  /auth/cilogon/callback:
    get:
      operationId: "project.auth.cilogon_callback"
      tags:
        - "Authentication"
      summary: "Completes institutional sign-in and stores the session user"
      parameters:
        - in: query
          name: state
          type: string
          required: false
        - in: query
          name: code
          type: string
          required: false
        - in: query
          name: error
          type: string
          required: false
      responses:
        302:
          description: Signed in; redirect back to the app
        400:
          description: Invalid state/nonce, missing code, or rejected identity token
        503:
          description: Institutional login is not configured on this server
  /auth/microsoft:
    get:
      operationId: "project.auth.microsoft_login"
      tags:
        - "Authentication"
      summary: "Starts Microsoft Entra (work/school) OIDC sign-in (identity-only scopes, PKCE)"
      parameters:
        - in: query
          name: next
          type: string
          required: false
          description: Same-origin path to return to after sign-in
      responses:
        302:
          description: Redirect to the Microsoft account-selection screen
        503:
          description: Microsoft sign-in is not configured on this server
  /auth/microsoft/callback:
    get:
      operationId: "project.auth.microsoft_callback"
      tags:
        - "Authentication"
      summary: "Completes Microsoft Entra sign-in and stores the session user"
      parameters:
        - in: query
          name: state
          type: string
          required: false
        - in: query
          name: code
          type: string
          required: false
        - in: query
          name: error
          type: string
          required: false
      responses:
        302:
          description: Signed in; redirect back to the app
        400:
          description: Invalid state/nonce, missing code, or rejected identity token
        503:
          description: Microsoft sign-in is not configured on this server
  /auth/me:
    get:
      operationId: "project.auth.me"
      tags:
        - "Authentication"
      summary: "Returns the current session's authentication state"
      responses:
        200:
          description: Authentication state returned
  /auth/logout:
    post:
      operationId: "project.auth.logout"
      tags:
        - "Authentication"
      summary: "Clears the authenticated user from the session"
      responses:
        200:
          description: Logged out
  /auth/dev-login:
    post:
      operationId: "project.auth.dev_login"
      tags:
        - "Authentication"
      summary: "Development-only session login (off unless QRESP_ENABLE_DEV_LOGIN is set)"
      parameters:
        - in: body
          name: credentials
          description: Development user identity
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
              name:
                type: string
              is_admin:
                type: boolean
      responses:
        200:
          description: Logged in
        400:
          description: Invalid credentials payload
        404:
          description: Dev login is disabled
  /verify/{id}:
    get:
      operationId: "project.api.verify"
      tags:
        - "Verify the user and publish"
      summary: "Publish the paper on the instance after successful verification"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Temporary ppublish id provided by the server
      responses:
        200:
          description: Paper successfully published
        400:
          description: Incorrect tmp publish paper id, no paper waiting to be published with this id
        500:
          description: Internal server error
