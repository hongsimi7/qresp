services:
  db:
    image: "mongo:3.6.18-xenial"
    # Named volume instead of hard-coded host paths. The old config required
    # ~/Repositories/MongoDB/{.env,init-mongo.js,QrespData}, which don't exist on
    # a clean checkout. A fresh no-auth dev DB needs no env_file/init script.
    volumes:
      - qresp_mongo_dev_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - backend

  backend:
    depends_on:
      - db
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      - PYTHONUNBUFFERED=TRUE
      - FLASK_APP=run.py
      - FLASK_ENV=development
      # Connect to the dev "db" service (read by project/config.py via QRESP_*).
      - QRESP_MONGODB_HOST=db
      - QRESP_MONGODB_PORT=27017
      - QRESP_MONGODB_DB_NAME=explorer
    volumes:
      - /usr/src/app/backend/project/static
      - ./backend:/home/flask/app/web/
    networks:
      - backend
    command: flask run --host 0.0.0.0

  gui:
    restart: always
    depends_on: 
      - db
    environment: 
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/usr/src/app
    networks: 
      - frontend
    command: yarn dev
  
  nginx:
    depends_on: 
      - backend
      - gui
    restart: always
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - "443:443"
      - "80:80"
    networks: 
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  qresp_mongo_dev_data:
      
